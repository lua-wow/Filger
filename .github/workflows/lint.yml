name: Lint

on:
    push:
        branches: [master]
        paths: ['**.lua', '**.xml', '*.toc', '.luacheckrc', 'Makefile', '.github/workflows/lint.yml']
    pull_request:
        paths: ['**.lua', '**.xml', '*.toc', '.luacheckrc', 'Makefile', '.github/workflows/lint.yml']

jobs:
    check:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  submodules: recursive # TOC lists files inside submodules
                  persist-credentials: false

            - name: Luacheck
              uses: lunarmodules/luacheck@v1

            - name: TOC check
              uses: lua-wow/toc-check@v1

    test:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Install Lua 5.1
              run: sudo apt-get update && sudo apt-get install -y lua5.1

            - name: Tests
              run: make test LUA=lua5.1
