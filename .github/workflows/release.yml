name: Release

on:
    push:
        tags:
            - 'v*'

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  submodules: recursive

            - name: Package
              uses: lua-wow/packager@v1
              with:
                  check-version: true
